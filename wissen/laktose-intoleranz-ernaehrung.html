<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<title>REHAB FIVE NUTRITION — Vorschau</title>
<meta name="description" content="Passwortgeschützte Vorschau der neuen NUTRITION-Seite.">
<!-- Kein og:image. Die Gate-Seite ist die einzige unverschluesselte Datei im
     Paket; ein Portrait darauf waere eine Veroeffentlichung ohne geklaerte
     Einwilligung. Der Physio-Bau zeigt hier die blosse Wortmarke als
     1200x630-Karte — fuer NUTRITION gibt es die noch nicht, und ein
     zurechtgeschnittenes Foto wird hier nicht ersatzweise genommen. Lieber
     eine Linkvorschau ohne Bild als eine, die etwas zeigt, was nicht
     freigegeben ist. -->
<meta property="og:type" content="website">
<meta property="og:title" content="REHAB FIVE NUTRITION — Vorschau">
<meta property="og:description" content="Passwortgeschützte Vorschau der neuen Seite. Zugang nur mit Passwort.">
<!-- Barlow selbst ausgeliefert. Hier zaehlt das doppelt: diese Seite ist die
     einzige unverschluesselte, sie laedt bei JEDEM Empfaenger des Links, und
     sie laedt noch vor jeder Eingabe. Ein Abruf bei Google Fonts waere genau
     der Fall, den man von aussen wirklich sehen kann — und ohne Einwilligung
     der haeufigste Abmahnpunkt. -->
<link rel="preload" href="../n4v8t2p/css/fonts/barlow-200-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../n4v8t2p/css/fonts/barlow-900-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../n4v8t2p/css/schriften.css">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:#0B1611;color:#FBF1E0;
       font-family:Barlow,system-ui,sans-serif}
  .gate{width:min(90vw,26rem);text-align:left}
  .gate h1{margin:0 0 .35rem;font-weight:900;text-transform:uppercase;
           font-size:clamp(1.75rem,6vw,2.5rem);line-height:1;letter-spacing:-.022em}
  .gate p{margin:0 0 2rem;font-weight:200;font-size:.9375rem;line-height:1.6;color:rgba(251,241,224,.7)}
  form{display:flex;gap:.5rem}
  input{flex:1;min-width:0;padding:.85rem 1rem;background:rgba(251,241,224,.06);color:#FBF1E0;
        border:1px solid rgba(251,241,224,.22);border-radius:2px;
        font-family:inherit;font-size:1rem;font-weight:300}
  input:focus{outline:2px solid #D99129;outline-offset:2px;border-color:transparent}
  button{padding:.85rem 1.4rem;border:0;border-radius:2px;cursor:pointer;background:#D99129;color:#0B1611;
         font-family:inherit;font-weight:900;text-transform:uppercase;font-size:.8125rem;letter-spacing:.08em}
  button:hover{background:#F0B860}
  button[disabled]{opacity:.5;cursor:default}
  .msg{margin:1rem 0 0;font-size:.8125rem;font-weight:300;min-height:1.2em;color:#F0B860}
  .foot{margin:3rem 0 0;font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(251,241,224,.35)}
</style>
</head>
<body>
<main class="gate">
  <h1>Nutrition</h1>
  <p>Interne Vorschau zum Gegenlesen. Bitte das Passwort eingeben.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" aria-label="Passwort" autofocus>
    <button id="go" type="submit">Öffnen</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <p class="foot">REHAB FIVE NUTRITION · Münster</p>
</main>
<script>
const DAT = '../n4v8t2p/d/wissen__laktose-intoleranz-ernaehrung.dat';
/* Eigener Schluesselname je Marke. Alle Vorschauen liegen auf derselben
   Herkunft (abraemswig-wq.github.io), und sessionStorage gilt pro Herkunft —
   nicht pro Unterordner. Mit dem gemeinsamen 'r5k' aus dem Physio-Bau wuerde
   diese Seite dessen Schluessel laden, am Entschluesseln scheitern und ihn im
   catch unten loeschen: die andere Vorschau waere im selben Tab wieder zu. */
const SKEY = 'r5nk';
const $ = s => document.querySelector(s);
const b2a = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const a2b = a => btoa(String.fromCharCode(...new Uint8Array(a)));

async function render(key, d){
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(d.iv) }, key, b2a(d.ct));
  document.open(); document.write(new TextDecoder().decode(buf)); document.close();
}

async function keyFromPw(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt:b2a(salt), iterations:250000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}

/* Schon in dieser Sitzung freigeschaltet? Dann stumm oeffnen — sonst fragt jede
   Unterseite erneut nach dem Passwort. Bei 27 Seiten, von denen 21 Artikel
   sind, waere die Vorschau damit unbenutzbar. */
(async () => {
  const raw = sessionStorage.getItem(SKEY);
  if (!raw) return;
  try {
    const d = await (await fetch(DAT, { cache:'no-store' })).json();
    const key = await crypto.subtle.importKey('raw', b2a(raw), 'AES-GCM', true, ['decrypt']);
    await render(key, d);
  } catch (_) { sessionStorage.removeItem(SKEY); }
})();

$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw').value;
  if (!pw) return;
  $('#go').disabled = true;
  $('#msg').textContent = 'Entschlüsseln …';
  try {
    const d = await (await fetch(DAT, { cache:'no-store' })).json();
    const key = await keyFromPw(pw, d.salt);
    await render(key, d);
    sessionStorage.setItem(SKEY, a2b(await crypto.subtle.exportKey('raw', key)));
  } catch (_) {
    $('#msg').textContent = 'Passwort stimmt nicht.';
    $('#go').disabled = false;
    $('#pw').select();
  }
});
</script>
</body>
</html>
